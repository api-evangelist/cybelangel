  - name: CybelAngel ADM Inventory API
    description: >-
      Attack surface (Asset Discovery & Monitoring) inventory. Lists discovered assets and
      their hostnames, lists threats joined with the owning asset record, and writes back
      asset and asset-threat statuses so an external system can triage shadow IT and
      exposed services programmatically.
    humanURL: https://developers.cybelangel.com/docs/adm-inventory-api/7e88d945427a4-fetch-assets-details-from-adm-inventory
