summary:
  official_client_libraries: 0
  official_distributions: 1
  sdk_languages: []
  note: >-
    CybelAngel publishes NO first-party client library in any language. Every public
    registry probed came back empty for "cybelangel": npm search returned 0 results,
    PyPI 404s for cybelangel / cybelangel-api / pycybelangel, RubyGems 404, NuGet 404.
    The CybelAngel GitHub organization has five public repos and none of them is an API
    client — chardet (a Go port), wireguard-ui, rabbitmq-storage-recoverer,
    atlantis-helm-charts and mini_usn are all internal infrastructure tools, the newest
    pushed 2025-09-03. What CybelAngel does ship is a Splunk technical add-on on
    Splunkbase and a copy-paste Python tutorial script in the docs. Consumers of the
    seven REST APIs are expected to use curl / Postman / Insomnia directly.
