  - name: CybelAngel Audit Logs API
    description: >-
      Searches the audit trail for an organization — who did what in the CybelAngel
      platform — scoped by organization_id in the path, for export into a SIEM or a
      compliance evidence store. Shipped Q2 2026 as "Audit Log Accessibility".
