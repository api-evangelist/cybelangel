    - {value: 24 hours, source: 'https://developers.cybelangel.com/docs/alerts-api/fbe89213b575d-api-calls'}
    - {value: '86400s (expires_in in the documented token response)', source: 'openapi/cybelangel-platform-reports-openapi.yml info.description'}
  note: >-
