id_conventions:
  - {entity: Report, form: 'opaque id + a separate human incident_id'}
  - {entity: Alert, form: 'opaque id, scoped by stream_id'}
  - {entity: AssetThreat, form: 'content hash — stable across re-detections of the same finding'}
  - {entity: Domain, form: 'natural key (the domain name)'}
  - {entity: Asset, form: 'surrogate id AND natural key (value); both accepted on writes'}
  - {entity: ClaimedAttack, form: reference_id}
  - {entity: AuditLog, form: event_id}
  - note: 'No prefixed ids anywhere (no rpt_/al_ style), so an id alone does not tell a client which entity it addresses.'
observations:
  - >-
    The graph is genuinely a graph, not a tree: InventoryAssetGraphDTO ships nodes + edges with
    a PivotMethod recorded on each edge — CybelAngel exposes HOW it pivoted from one observable
    to another, which is unusual and valuable for an EASM API.
  - >-
    Localization leaks into the data model: threat descriptions are TranslationElementDTO
    objects with `en` and `fr` keys rather than a single string plus a locale header.
  - >-
    Partial-success is a first-class shape on the Keywords surfaces — HTTP 207 with
    created_keywords[] + failed_keywords[] (each failure carrying error_code and error_details).
    A client that only checks for 200 will silently drop failures.
  - >-
    The Reports API duplicates ReportComment as AddReportCommentResponse with identical fields
    instead of reusing the schema — 17 schemas for 21 operations, versus 48-73 for the newer APIs.
