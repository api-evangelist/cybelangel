apis:
  - name: CybelAngel Reports API
    description: >-
      The original CybelAngel Platform API. Retrieves incident reports (v2 search plus
      per-report detail, mirror listings in JSON/CSV/archive, PDF export, attachments and
      comments), the leaked-credential watchlist and its CSV export, the malicious-domain
      watchlist, report assets, report volume statistics, and the caller's report
      permissions. Also moves report and credential statuses and files analyst remediation
      requests. OAuth 2.0 client-credentials with a documented scope set.
    humanURL: https://developers.cybelangel.com/docs/cybelangel-platform-api/39d4926befc14-what-can-i-do-with-this-api
    baseURL: https://platform.cybelangel.com/api
    tags:
      - incident-reports
      - credential-intelligence
      - domain-monitoring
      - remediation
      - cybersecurity
    properties:
      - type: OpenAPI
        url: openapi/cybelangel-platform-reports-openapi.yml
      - type: Documentation
        url: https://developers.cybelangel.com/docs/cybelangel-platform-api/39d4926befc14-what-can-i-do-with-this-api
      - type: APIReference
        url: https://developers.cybelangel.com/docs/cybelangel-platform-api/68a341c676710-references
      - type: GettingStarted
        url: https://developers.cybelangel.com/docs/cybelangel-platform-api/05d245301ecc5-get-your-api-credentials
      - type: Authentication
        url: https://developers.cybelangel.com/docs/cybelangel-platform-api/b6b6c2d4906e9-authentication
      - type: OAuthScopes
        url: scopes/cybelangel-scopes.yml
      - type: Sandbox
        url: https://stoplight.io/mocks/cybelangel/cybelangel-platform-api/84330
      - type: Overlay
        url: overlays/cybelangel-platform-reports-overlay.yaml
  - name: CybelAngel Alerts API
    description: >-
      "Alerts in Feed" — real-time machine-readable access to the alerts CybelAngel's
      collection and ML pipeline generates across ADM, Board, Cloud Drive, DNS, Database,
      Docshare, Codeshare, Fileserver, Leak, Paste and RSS categories. Search by keyword,
      IP, hostname and detection date; fetch a single alert; fetch leaked credentials and
      codeshare findings attached to an alert; fetch a DNS screenshot; PATCH a customer
      assessment status; and retrieve the same alerts as OASIS STIX bundles.
    humanURL: https://developers.cybelangel.com/docs/alerts-api/72b66de24898e-cybel-angel-alerts-api-real-time-threat-intelligence
    baseURL: https://api.cybelangel.com
    tags:
