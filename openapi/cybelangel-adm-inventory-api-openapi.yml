        required: false
        schema:
          type: array
          title: Asset Ids
          description: List of asset IDs (UUIDs). Cannot be used together with 'asset_values' parameter.
          items:
            type: string
            format: uuid
      - name: severity
        in: query
        description: To get threats with specific severity
        required: false
        schema:
