aid: cybelangel
name: CybelAngel
description: >-
  CybelAngel is a Paris- and Boston-based external risk protection company that scans the
  public internet, the deep and dark web, connected devices, cloud storage, code-sharing
  and paste sites for a customer's exposed data and unmanaged assets. Its platform covers
  external attack surface (ADM) inventory, data-breach prevention, credential intelligence,
  brand protection and domain/social-media impersonation, cyber threat intelligence, and
  analyst-led remediation. For developers it publishes seven documented REST APIs on a
  Stoplight developer portal — Reports (incident reports, credential and domain watchlists,
  assets, remediation requests), Alerts in Feed (real-time alerts, also served in OASIS STIX
  format), ADM Inventory, Keywords, Threat Intelligence claimed-attacks, Audit Logs and a
  Partner API for MSSPs managing client organizations — all authenticated with OAuth 2.0
  client-credentials bearer tokens minted by an Auth0 tenant, plus CybelAngel Connect, a
  no-code automation studio for ServiceNow, Jira, Splunk, Slack, Cortex XSOAR, IBM Security
  SOAR and Azure Sentinel.
