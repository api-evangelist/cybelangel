      source: https://cybelangel.com/blog/cybelangel-soc-2-type-1-certification-2026/
      also: https://cybelangel.com/blog/cybelangel-renews-soc-2-type-1-compliance/
  not_claimed: [SOC 2 Type II, PCI DSS, HIPAA, FedRAMP, 'CSA STAR', 'FIPS 140']
  regimes_supported_for_customers:
    - {id: nist-csf-2.0, role: 'CybelAngel supports NIST CSF 2.0 by delivering external risk visibility and actionable threat intelligence'}
    - {id: dora, role: 'external risk monitoring for third-party risk and vulnerability visibility'}
    - {id: nis2, role: 'proactive threat detection and vulnerability management'}
    - {id: gdpr, role: 'https://cybelangel.com/data-processing-policy/ and https://cybelangel.com/privacy-policy/'}
  note: >-
    Read carefully: ISO 27001 and SOC 2 Type I are certifications CybelAngel HOLDS. NIST CSF
    2.0, DORA and NIS 2 are regimes CybelAngel helps its CUSTOMERS meet — they are product
    positioning, not CybelAngel's own attestations, and are recorded separately for that reason.
    There is no trust center (trust.cybelangel.com does not resolve) and no downloadable
    attestation portal, which is why apis.yml carries a `Compliance` pointer but no `TrustCenter`.
