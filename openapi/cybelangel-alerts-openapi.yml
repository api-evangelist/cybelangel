    Finding:
      type: object
      title: Finding
      description: |-
        A finding we found in a document at a specific commit: a snippet of code matched by a rule.
        This contains the snippet itself (the source code), along with some contextual information, such as the URL to the file or the commit ID, among others.
      properties:
        rule:
          type: string
          title: Rule
          description: Identifier of the internal rule that matched this finding in the code.
          examples:
            - GENERIC_KEY
        filepath:
          type: string
          title: Filepath
          description: Relative path of the matched file in the repository.
          examples:
            - mysite/settings.py
        match_url:
          type: string
          title: Match Url
          description: URL to the matched file at the specific commit.
          examples:
            - 'https://github.com/johndoe/global-app/blob/dbc3641fee7cb8911f73fee6e255c1b0a96b32f5/mysite/settings.py#L23'
        commit:
          type: string
          title: Commit
          description: ID of the commit in which the rule matched.
          examples:
            - dbc3641fee7cb8911f73fee6e255c1b0a96b32f5
        match_content:
          $ref: '#/components/schemas/Region'
          description: 'The precise code containing secrets or credentials, matched by the rule.'
          example:
            end_column: 83
            end_line: 23
            snippet: SECRET_KEY = 'django-insecure-9bf)5h*)pqkf12i)^lc5#gq$3q7v9m0x5wzm=r$qdde7br%uan'
            start_column: 1
            start_line: 23
        match_context:
          $ref: '#/components/schemas/Region'
          description: Code snippet around the content matched by the rule.
          example:
            end_column: null
            end_line: 28
            snippet: |-
              # Quick-start development settings - unsuitable for production
              # See https://docs.djangoproject.com/en/5.1/howto/deployment/checklist/

              # SECURITY WARNING: keep the secret key used in production secret!
              SECRET_KEY = 'django-insecure-9bf)5h*)pqkf12i)^lc5#gq$3q7v9m0x5wzm=r$qdde7br%uan'

              # SECURITY WARNING: don't run with debug turned on in production!
              DEBUG = True 
              # 'localhost', '127.0.0.1', '.pythonanywhere.com'
              ALLOWED_HOSTS = ['*']
            start_column: 1
            start_line: 19
      required:
        - rule
        - filepath
        - match_url
        - commit
        - match_content
        - match_context
    Region:
      type: object
      title: Region
      description: |-
        Region of the file matched by the rule: the code snippet along with the line and column numbers that delimit it.
        This schema complies with SARIF v2.0 standard.
      properties:
        snippet:
          type: string
          title: Snippet
          description: Code extract from start_line and start_column to end_line and end_column.
        start_line:
          type: integer
          title: Start Line
          description: Starting line number of the code snippet in the source.
          exclusiveMinimum: 0
        start_column:
          type: integer
          title: Start Column
          description: Starting column number of the code snippet in the source.
          exclusiveMinimum: 0
        end_line:
          type: integer
          title: End Line
          description: Final line number of the code snippet in the source.
          exclusiveMinimum: 0
        end_column:
          title: End Column
          description: 'Final column number of the code snippet in the source. If not set, it means end of the line.'
          anyOf:
            - type: integer
              exclusiveMinimum: 0
      required:
        - snippet
        - start_line
        - start_column
        - end_line
    StixAlertsResponse:
      type: object
      title: StixAlertsResponse
      description: Response to a search of STIX objects from alerts data.
      properties:
        stix_bundle:
          type: object
          title: Stix Bundle
          description: |-
            STIX Bundle object used to aggregate STIX objects, both SDO, SCO and SRO.
            See https://docs.oasis-open.org/cti/stix/v2.1/csprd01/stix-v2.1-csprd01.html#_Toc16070770 for more information.
        more:
          type: boolean
          title: More
          description: Set to true when there are more alerts to retrieve with the same search request parameters and a new 'cursor'.
          default: false
        cursor:
          title: Cursor
          description: 'Set when there are more alerts to retrieve. It can be used in another search request, with the same parameters, to download the following alerts.'
          anyOf:
            - type: string
      required:
        - stix_bundle
