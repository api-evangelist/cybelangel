summary:
  types: [oauth2, http]
  oauth2_flows: [clientCredentials]
  api_key_in: []
  single_credential: true
  note: >-
    One credential pair covers all seven APIs. The specs declare the mechanism inconsistently
    but describe the same thing: the Reports API declares a full oauth2 clientCredentials
    scheme with a tokenUrl and 10 named scopes, while the six api.cybelangel.com specs declare
    only a bare `jwt` http-bearer scheme with no token endpoint and no scopes. The bearer they
    accept is the same Auth0-issued token, so the http-bearer declarations are an
    under-specification of the oauth2 flow rather than a second auth model. This artifact is
    marked `searched` because the token endpoint, audience, credential provisioning and quota
    come from the docs, not from those six specs.
